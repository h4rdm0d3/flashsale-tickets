# Builds the service's image on every push to main and pushes it to your
# GitHub Container Registry as ghcr.io/<you>/<repo>:<commit>. Deploy it in
# the lab by putting that image in ~/values.yaml and running `deploy`.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: go test ./...
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        run: |
          # Registry names are lowercase.
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA::12}"
          # Lab machines are x86-64.
          docker buildx build --platform linux/amd64 -t "$image" --push .
          echo "### Pushed \`$image\`" >> "$GITHUB_STEP_SUMMARY"
